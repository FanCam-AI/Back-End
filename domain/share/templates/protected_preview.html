<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="Protected File"/>
  <meta property="og:description" content="This file is password protected. Enter password to access."/>
  <meta property="og:image" content="{{ thumbnail_url }}"/>
  <meta property="og:url" content="{{ og_url }}"/>

  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected File Preview</title>

  <style>
    body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* center → flex-start */
            padding-top: 120px;      /* 시작 높이 고정 */
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #111;
        }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 90%;
      padding: 2rem;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
      border: 1px solid #e5e5e5;
    }

    .card h2 {
      margin-bottom: 1rem;
      font-size: 1.6rem;
      font-weight: 700;
      color: #000;
    }

    .card p {
      margin-bottom: 2rem;
      font-size: 1rem;
      color: #555;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      background: #000;
      color: #fff;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: #333;
      transform: translateY(-2px);
    }

    .small-link {
      font-size: 0.9rem;
      color: #555;
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🔒 This file is password protected</h2>
    <p>You need to enter the correct password to view the content.</p>

    <a href="{{ protected_url }}" class="btn">Enter Password</a>

    <br><br>

    <p>
      <a href="{{ appstore_url }}" target="_blank" class="small-link">
        Click here to download FanCam AI!
      </a>
    </p>
  </div>
</body>
</html>
